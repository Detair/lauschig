name: CodeQL

# Code scanning for the Kotlin code and for the workflow files. CodeQL has to watch a real build to read Kotlin, and
# GitHub's automatic setup cannot build this project, so the build is spelled out here. Findings appear in the
# repository's Security tab and on the pull request that introduces them.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # to hand the findings to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6
        if: matrix.build-mode == 'manual'
        with:
          distribution: temurin
          java-version: 21
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build for the analysis
        if: matrix.build-mode == 'manual'
        # CodeQL reads what the compiler really compiles: no build cache, no configuration cache, no daemons.
        run: >
          ./gradlew :app:assembleDebug
          --no-daemon --no-build-cache --no-configuration-cache
          -Pkotlin.compiler.execution.strategy=in-process
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      # The result file also says how many lines of Kotlin the scan really covered (`metricResults`): the one number
      # that tells a working scan from one that saw no code.
      - name: Upload the result file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/
          retention-days: 14
