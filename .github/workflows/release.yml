name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode upload keystore
        env:
          LAUSCHIG_KEYSTORE_BASE64: ${{ secrets.LAUSCHIG_KEYSTORE_BASE64 }}
        run: |
          test -n "$LAUSCHIG_KEYSTORE_BASE64" || { echo "LAUSCHIG_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$LAUSCHIG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "LAUSCHIG_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        env:
          LAUSCHIG_KEYSTORE_PASSWORD: ${{ secrets.LAUSCHIG_KEYSTORE_PASSWORD }}
          LAUSCHIG_KEY_ALIAS: ${{ secrets.LAUSCHIG_KEY_ALIAS }}
          LAUSCHIG_KEY_PASSWORD: ${{ secrets.LAUSCHIG_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: lauschig-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
