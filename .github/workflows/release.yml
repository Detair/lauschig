name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true
      - name: Decode upload keystore
        env:
          LAUSCHIG_KEYSTORE_BASE64: ${{ secrets.LAUSCHIG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$LAUSCHIG_KEYSTORE_BASE64" || { echo "LAUSCHIG_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$LAUSCHIG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "LAUSCHIG_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        env:
          LAUSCHIG_KEYSTORE_PASSWORD: ${{ secrets.LAUSCHIG_KEYSTORE_PASSWORD }}
          LAUSCHIG_KEY_ALIAS: ${{ secrets.LAUSCHIG_KEY_ALIAS }}
          LAUSCHIG_KEY_PASSWORD: ${{ secrets.LAUSCHIG_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - name: Upload AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lauschig-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
